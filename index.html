<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Project - Iteração 2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<div class="logo">NETFLIX PROJECT</div>
<div class="nav">
<button id="homeBtn" class="secondary">Início</button>
<button id="favBtn" class="secondary">Favoritos</button>
<button id="profileBtn" class="secondary">Perfil</button>
<button id="adminBtn" class="secondary">Admin</button>
<button id="logoutBtn" class="secondary">Sair</button>
</div>
</header>
<main>
<section id="auth">
<div class="hero"><h1>Catálogo de filmes e séries</h1><p class="small">Pesquise, avalie e favorite títulos.</p></div>
<div class="grid">
<div class="card"><h2>Entrar</h2>
<form id="loginForm"><label>E-mail</label><input id="loginEmail" type="email" required>
<label>Senha</label><input id="loginPassword" type="password" required>
<button type="submit">Entrar</button></form>
<div id="loginMsg"></div>
<p class="small">Admin: admin@netflix.com / 1234<br>Usuário: user@netflix.com / 1234</p></div>
<div class="card"><h2>Criar conta</h2>
<form id="registerForm"><label>Nome</label><input id="regName" required>
<label>E-mail</label><input id="regEmail" type="email" required>
<label>Senha (mín. 4 caracteres)</label><input id="regPassword" type="password" minlength="4" required>
<button type="submit">Cadastrar</button></form>
<div id="registerMsg"></div></div>
</div>
</section>

<section id="home" class="hidden"><div class="hero">
<h1>Pesquisar filmes e séries</h1>
<input id="search" placeholder="Digite o nome do título...">
<div class="filters">
<select id="fType"><option value="">Todos os tipos</option><option>Filme</option><option>Série</option></select>
<select id="fGenre"></select>
<select id="fSort"><option value="title">Ordenar: Título</option><option value="year">Ordenar: Ano (recente)</option><option value="rating">Ordenar: Nota média</option></select>
</div>
<div id="results" class="grid"></div></div></section>

<section id="details" class="hidden"><div class="card" id="detailsContent"></div></section>
<section id="favorites" class="hidden"><div class="card"><h2>Meus favoritos</h2><div id="favoriteList" class="grid"></div></div></section>

<section id="profile" class="hidden"><div class="card"><h2>Meu perfil</h2>
<form id="profileForm"><label>Nome</label><input id="pName" required>
<label>E-mail</label><input id="pEmail" disabled>
<label>Nova senha (deixe em branco para manter)</label><input id="pPass" type="password" minlength="4">
<button type="submit">Salvar alterações</button></form><div id="profileMsg"></div></div></section>

<section id="admin" class="hidden"><div class="card">
<h2>Área Administrativa</h2>
<h3>Usuários</h3><div id="usersTable"></div>
<h3 id="formTitle">Adicionar conteúdo</h3>
<form id="movieForm"><input type="hidden" id="mId">
<label>Título</label><input id="mTitle" required>
<div class="filters"><select id="mType"><option>Filme</option><option>Série</option></select>
<input id="mYear" type="number" min="1900" max="2100" placeholder="Ano" required>
<input id="mGenre" placeholder="Gênero (ex.: Ficção)" required></div>
<label>Sinopse</label><textarea id="mSyn" required></textarea>
<div class="actions"><button type="submit">Salvar conteúdo</button><button type="button" id="mCancel" class="secondary">Cancelar edição</button></div></form>
<div id="adminMsg"></div>
<h3>Conteúdos</h3><div id="adminMovies" class="grid"></div>
<p><button id="resetBtn" class="secondary">Restaurar dados de demonstração</button></p>
</div></section>
</main>
<script src="js/app.js"></script>
</body>
</html>
